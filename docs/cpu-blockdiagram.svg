<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -75 870 880" width="870" font-family="Helvetica, Arial, sans-serif"><rect x="0" y="-75" width="870" height="880" fill="#ffffff"/><text x="40" y="-22" font-size="28" fill="#1e1e1e">MiniCPU-8 - block diagram (M2)</text><rect x="40" y="40" width="780" height="80" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="430.0" y="72.0" text-anchor="middle" font-size="20" font-weight="bold">CONTROL UNIT (FSM)</text><text x="430.0" y="98.0" text-anchor="middle" font-size="14" fill="#444">FETCH -&gt; DECODE -&gt; EXECUTE</text><rect x="40" y="230" width="150" height="80" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><text x="115.0" y="262.0" text-anchor="middle" font-size="20" font-weight="bold">PC</text><text x="115.0" y="288.0" text-anchor="middle" font-size="14" fill="#444">program counter</text><rect x="230" y="230" width="170" height="80" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><text x="315.0" y="262.0" text-anchor="middle" font-size="20" font-weight="bold">IR</text><text x="315.0" y="288.0" text-anchor="middle" font-size="14" fill="#444">opcode | operand</text><rect x="440" y="230" width="130" height="80" rx="12" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="505.0" y="262.0" text-anchor="middle" font-size="20" font-weight="bold">FLAGS</text><text x="505.0" y="288.0" text-anchor="middle" font-size="14" fill="#444">Z   C</text><rect x="610" y="230" width="200" height="80" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/><text x="710.0" y="262.0" text-anchor="middle" font-size="20" font-weight="bold">ALU</text><text x="710.0" y="288.0" text-anchor="middle" font-size="14" fill="#444">ADD SUB AND OR</text><rect x="40" y="400" width="150" height="70" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/><text x="115.0" y="427.0" text-anchor="middle" font-size="20" font-weight="bold">MAR</text><text x="115.0" y="453.0" text-anchor="middle" font-size="14" fill="#444">address register</text><rect x="40" y="540" width="340" height="100" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><text x="210.0" y="582.0" text-anchor="middle" font-size="20" font-weight="bold">MEMORY 256 x 8</text><text x="210.0" y="608.0" text-anchor="middle" font-size="14" fill="#444">block RAM: program + data</text><rect x="440" y="540" width="130" height="100" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><text x="505.0" y="582.0" text-anchor="middle" font-size="20" font-weight="bold">ACC</text><text x="505.0" y="608.0" text-anchor="middle" font-size="14" fill="#444">accumulator</text><path d="M 115 120 L 115 230" fill="none" stroke="#6741d9" stroke-width="2" stroke-dasharray="7 5"/><polygon points="115.0,230.0 109.0,218.0 121.0,218.0" fill="#6741d9"/><path d="M 315 230 L 315 120" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="315.0,120.0 321.0,132.0 309.0,132.0" fill="#1e1e1e"/><text x="322" y="181" font-size="16" fill="#1e1e1e">opcode</text><path d="M 505 230 L 505 120" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="505.0,120.0 511.0,132.0 499.0,132.0" fill="#1e1e1e"/><text x="512" y="181" font-size="16" fill="#1e1e1e">flags</text><path d="M 710 120 L 710 230" fill="none" stroke="#6741d9" stroke-width="2" stroke-dasharray="7 5"/><polygon points="710.0,230.0 704.0,218.0 716.0,218.0" fill="#6741d9"/><text x="718" y="181" font-size="16" fill="#6741d9">ALU op</text><path d="M 115 310 L 115 400" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="115.0,400.0 109.0,388.0 121.0,388.0" fill="#1e1e1e"/><text x="122" y="356" font-size="16" fill="#1e1e1e">fetch: PC -&gt; MAR</text><path d="M 270 310 L 270 435 L 190 435" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="190.0,435.0 202.0,429.0 202.0,441.0" fill="#1e1e1e"/><text x="200" y="458" font-size="16" fill="#1e1e1e">execute:</text><text x="200" y="478" font-size="16" fill="#1e1e1e">operand -&gt; MAR</text><path d="M 115 470 L 115 540" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="115.0,540.0 109.0,528.0 121.0,528.0" fill="#1e1e1e"/><text x="122" y="511" font-size="16" fill="#1e1e1e">address</text><path d="M 350 540 L 350 310" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="350.0,310.0 356.0,322.0 344.0,322.0" fill="#1e1e1e"/><text x="357" y="466" font-size="16" fill="#1e1e1e">instruction</text><text x="357" y="486" font-size="16" fill="#1e1e1e">(fetch)</text><path d="M 380 590 L 440 590" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="440.0,590.0 428.0,596.0 428.0,584.0" fill="#1e1e1e"/><polygon points="380.0,590.0 392.0,584.0 392.0,596.0" fill="#1e1e1e"/><path d="M 520 540 L 650 310" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="650.0,310.0 649.3,323.4 638.9,317.5" fill="#1e1e1e"/><text x="600" y="441" font-size="16" fill="#1e1e1e">A</text><path d="M 210 640 L 210 700 L 720 700 L 720 310" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="720.0,310.0 726.0,322.0 714.0,322.0" fill="#1e1e1e"/><text x="380" y="722" font-size="16" fill="#1e1e1e">operand B (from memory)</text><path d="M 790 310 L 790 610 L 570 610" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="570.0,610.0 582.0,604.0 582.0,616.0" fill="#1e1e1e"/><text x="800" y="466" font-size="16" fill="#1e1e1e">result</text><path d="M 610 270 L 570 270" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="570.0,270.0 582.0,264.0 582.0,276.0" fill="#1e1e1e"/><text x="40" y="766" font-size="16" fill="#555555">dashed = control signals (PC load/increment, MAR load, RAM write, ACC load, flag update).</text><text x="40" y="786" font-size="16" fill="#555555">solid = data / address.  Registers (PC, IR, MAR, ACC, FLAGS) change only on the clock edge.</text></svg>